name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest
      - run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: debrid-fetch:ci
          cache-from: type=gha
      - name: Image declares no downloads volume
        run: |
          vols=$(docker inspect --format '{{json .Config.Volumes}}' debrid-fetch:ci)
          echo "volumes: $vols"
          ! echo "$vols" | grep -q /data/downloads
      - name: Container downloads and resumes after restart
        timeout-minutes: 3
        run: python3 tests/docker_download_resume.py
